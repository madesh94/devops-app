name: AWS Runner Test

on:
  workflow_dispatch:

jobs:
  verify-aws-runner:
    runs-on: [self-hosted, aws-ec2]

    steps:
      - name: Display runner information
        run: |
          echo "Testing AWS GitHub Actions Runner"
          hostname
          whoami
          pwd

      - name: Verify Docker installation
        run: |
          docker --version
          sudo systemctl is-active docker

      - name: Test completed
        run: echo "AWS runner verification successful!"
