name: DevOps CI

on:
  push:
    branches:
      - main
      - feature/health-check

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check Python syntax
        run: python -m py_compile app.py

      - name: Run tests
        run: python -m unittest tests/test_app.py

      - name: Build Docker image
        run: docker build -t devops-app:test .

      - name: Run Docker container
        run: docker run -d -p 8082:8080 --name devops-app-test devops-app:test

      - name: Check Docker container
        run: |
          docker ps
          docker logs devops-app-test

      - name: Test Docker container
        run: |
          for i in {1..10}; do
            if curl -s http://localhost:8082; then
              exit 0
            fi
            sleep 1
          done
          exit 1
