name: DevOps CI

on:
  push:
    branches:
      - main
      - feature/health-check

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check Python syntax
        run: python -m py_compile app.py

      - name: Run tests
        run: python -m unittest tests/test_app.py
